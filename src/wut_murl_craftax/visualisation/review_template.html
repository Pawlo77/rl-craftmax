<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highlight review</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#666;--line:#ddd;--keep:#e6f4ea;--drop:#f6f6f6}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#eee;--mute:#999;--line:#333;--keep:#1d3b27;--drop:#222}}
body{background:var(--bg);color:var(--fg);font:14px system-ui;margin:16px}
table{border-collapse:collapse;width:100%}
td{border-top:1px solid var(--line);padding:8px;vertical-align:top}
img,video{image-rendering:pixelated;max-width:100%} video{width:240px}
.mute{color:var(--mute);font-size:12px} .cap{width:260px}
.keep{background:var(--keep)} .drop{opacity:.45;background:var(--drop)}
header{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1}
button{font-size:14px;padding:6px 12px;margin-right:8px}
@media (max-width:900px){td{display:block;border:0;padding:4px 0}.row{display:block;border-top:1px solid var(--line)}.cap{width:100%}}
</style></head><body>
<header><b id="title"></b> &middot; <span id="n">0</span> kept, <span id="s">0</span> s
<button id="top">Keep top 10</button><button id="dl">Download review.csv</button></header>
<table><tbody id="rows"></tbody></table>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'review:' + D.source, SPEEDS = ['0.5', '1', '2', '4', '8'];
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
function row(r) {
  Object.assign(r, saved[r.id] || {});
  const tr = el('tr', {className: 'row ' + r.keep});
  const cap = el('input', {className: 'cap', value: r.caption});
  const spd = el('select', {}, ...SPEEDS.map(s => el('option', {selected: s === r.speed}, s)));
  const radio = v => el('label', {}, el('input', {type: 'radio', name: 'k' + r.id, value: v, checked: r.keep === v}), ' ' + v);
  const update = () => { const k = tr.querySelector('input[type=radio]:checked');
    r.keep = k ? k.value : ''; r.caption = cap.value; r.speed = spd.value; tr.className = 'row ' + r.keep; sync(); };
  tr.addEventListener('input', update); tr.addEventListener('change', update); tr.mark = v => { tr.querySelector(`input[value=${v}]`).checked = true; update(); };
  tr.append(
    el('td', {}, el('b', {}, r.id), el('br'), r.score, el('br'), el('span', {className: 'mute'}, r.type)),
    el('td', {}, el('img', {src: `strips/${r.id}.png`, loading: 'lazy'}), el('br'), el('span', {className: 'mute'}, r.events.slice(0, 300))),
    el('td', {}, el('video', {src: `previews/${r.id}.mp4`, controls: true, loop: true, muted: true, preload: 'none', poster: `thumbs/${r.id}.png`})),
    el('td', {}, cap, el('br'), el('span', {className: 'mute'}, `${r.label} · ${r.rollout} frames ${r.start}-${r.end} (${r.seconds} s)`), el('br'), 'speed ', spd),
    el('td', {}, radio('keep'), el('br'), radio('drop')));
  return tr;
}
function sync() {
  const k = D.rows.filter(r => r.keep === 'keep');
  document.getElementById('n').textContent = k.length;
  document.getElementById('s').textContent = k.reduce((a, r) => a + r.seconds / r.speed, 0).toFixed(1);
  D.rows.forEach(r => { saved[r.id] = {keep: r.keep, caption: r.caption, speed: r.speed}; });
  try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
}
const trs = D.rows.map(row); document.getElementById('rows').append(...trs);
document.getElementById('title').textContent = `${D.rows.length} candidates from ${D.source}`;
document.getElementById('top').onclick = () => trs.slice(0, 10).forEach(tr => tr.mark('keep'));
const q = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
document.getElementById('dl').onclick = () => {
  const csv = [D.columns.join(',')].concat(D.rows.map(r => D.columns.map(c => q(String(r[c] ?? ''))).join(','))).join('\n') + '\n';
  const a = el('a', {href: URL.createObjectURL(new Blob([csv], {type: 'text/csv'})), download: 'review.csv'}); a.click();
};
sync();
</script></body></html>
