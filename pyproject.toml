[project]
name = "wut_murl_craftax"
version = "0.1.0"
description = "Reinforcement learning on Craftax"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]
maintainers = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]

keywords = [
  "experiments",
  "mlflow",
  "research",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # The environment and the RL stack. jax stays below 0.12 because metaljax (Apple GPU) needs >=0.11,<0.12;
  # versions are the ones tested on Apple Silicon in knowledge/craftax/Craftax on Apple GPU.md.
  "craftax==1.6.1",
  "flax==0.12.10",
  "jax==0.11.2",
  "jaxlib==0.11.2",
  "optax==0.2.8",
  "humanize>=4.15.0",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "matplotlib>=3.10.8",
  "mlflow>=3.0.0",
  "mlflow-sysmetrics>=0.1.3",
  "nbformat>=5.10.4",
  "numpy>=2.4.2",
  "pandas>=2.2.0",
  # Parquet files of the SMDP skills method (greedy table per checkpoint); already installed via mlflow.
  "pyarrow>=21.0.0",
  "psutil>=7.2.2",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.2",
  # Decision-tree distillation of trained policies (interpretation); already installed via mlflow.
  "scikit-learn>=1.9.1",
  # Bootstrap CIs, Mann-Whitney with Holm and t intervals of the method comparison; already
  # installed via mlflow.
  "scipy>=1.18.1",
  "seaborn>=0.13.2",
  "tqdm>=4.67.0",
]

[project.urls]
Homepage = "https://github.com/Pawlo77/wut_murl_craftax"
Repository = "https://github.com/Pawlo77/wut_murl_craftax"
Issues = "https://github.com/Pawlo77/wut_murl_craftax/issues"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# Apple GPU backend for JAX (make install syncs all groups). Inactive until JAX_PLATFORMS=metal:
# correct results and faster network updates, but Craftax env stepping is faster on CPU.
metal = [
  "metaljax==0.11.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# NVIDIA GPU backend for the Linux clusters, matched to jax 0.11.2. nvidia-ml-py provides
# `pynvml`, which MLflow's system metrics need to log GPU utilisation and memory per run.
cuda = [
  "jax[cuda12]==0.11.2; sys_platform == 'linux'",
  "nvidia-ml-py>=12.535; sys_platform == 'linux'",
]
dev = [
  "bandit>=1.9.4",
  "mypy>=1.16.0",
  "prek>=0.4.9",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "ty>=0.0.85",
  "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
required-version = ">=0.11.28"

[tool.ruff]
target-version = "py312"
line-length = 88
# Generated rules and skill Markdown hold Python fences; the vendored skill stays as shipped.
# The book skills' helpers keep their own style; the book notebooks are executed outputs.
extend-exclude = [
  ".claude/rules", ".agents/skills/caveman", ".agents/**/*.md",
  ".agents/skills/book-chapter-*", "research/*/notebooks",
]

[tool.ruff.lint]
select = [
  "B", "E", "F", "I", "N", "RUF", "SIM", "T10", "UP",
  "D", "PT", "PTH", "TRY", "PERF", "FURB", "ARG", "C4", "ISC", "RET",
  "C901", "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["wut_murl_craftax"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ['craftax', 'craftax.*', 'optax', 'optax.*', 'mlflow', 'mlflow.*', 'yaml', 'yaml.*', 'pandas', 'pandas.*', 'pyarrow', 'pyarrow.*', 'scipy', 'scipy.*', 'sklearn', 'sklearn.*']
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "notebooks", "report"]
skips = ["B404", "B603"]  # git and system probes in reproducibility.py


[tool.pytest.ini_options]
pythonpath = [".", "src"]
filterwarnings = [
]


[tool.coverage.run]
source = ["wut_murl_craftax"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true



[tool.uv.build-backend]
module-name = "wut_murl_craftax"

[tool.agent-kit]
name = "wut_murl_craftax"
tree-dirs = "src tests"
vault-dirs = "knowledge"

[tool.codespell]
ignore-words-list = "mannor,openes,ore,parmas,useable,pyproject,toml,venv,prek,kwargs,args,init,utils,workflow,workflows,pytest,cov"
skip = "report/*,research/*/notebooks/*,research/*/sources/*"   # base64 images, OCR snapshot

[tool.agent-kit.vault.schema]
dirs = ["knowledge"]
required = ["title", "type", "domain", "created", "parent"]
types = [
  "map", "dashboard", "module", "decision-log", "issue", "concept", "handbook",
  "solution", "plan", "generated",
]
link-fields = ["related-code"]
sections-exempt = ["Fixed issues"]

[tool.agent-kit.vault.schema.exempt]
parent = ["map"]
created = ["generated"]

[tool.agent-kit.vault.schema.statuses]
issue = ["open", "fixed", "wontfix", "deferred"]
plan = ["draft", "ready", "in progress", "done", "superseded"]

[tool.agent-kit.vault.schema.sections]
module = ["Responsibility", "Public surface", "Data flow", "Invariants", "Tests"]
issue = ["Symptom", "Cause", "Repro", "Fix"]
solution = ["Problem", "What was tried", "What worked", "Reusable rule"]

[tool.agent-kit.knowledge]
package = "src/wut_murl_craftax"
generators = ["modules", "public-api"]
parent = "[[wut_murl_craftax]]"

[tool.agent-kit.obsidian-plugins]
templater-obsidian = "silentvoid13/Templater"
mermaid-tools = "dartungar/obsidian-mermaid"

[tool.agent-kit.vault]
link-dirs = ["research"]           # book notes: linkable, link-checked, outside the knowledge schema
flat = [".remember"]               # plans/ may hold one subfolder per multi-file plan

# The book skills came over from the earlier vault at these sizes
[tool.agent-kit.brevity.existing]
".agents/skills/book-chapter-notebooks/SKILL.md|words" = 1409
".agents/skills/book-chapter-notebooks/SKILL.md|lines" = 127
".agents/skills/book-chapter-notebooks/scripts/run_notebook.py|module docstring lines" = 17
".agents/skills/book-chapter-notes/SKILL.md|words" = 1432
".agents/skills/book-chapter-notes/SKILL.md|lines" = 161
".agents/skills/book-chapter-notes/references/final-review.md|words" = 603

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/AGENTS.md"]
lines = 60
