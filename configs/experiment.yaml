# MLflow settings of every run; the runner replaces experiment_name with the phase
# and sets each run's name (<registry>-<budget>-<confighash8>-s<seed>).
experiment:
  name: craftax

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlruns.db
  experiment_name: craftax
  run_name: null
  log_params: true
  log_metrics: true
  log_artifacts: true
  retain_local_checkpoints: false
