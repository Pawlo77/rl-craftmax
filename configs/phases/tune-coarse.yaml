# Stage 1 of the tuning: one knob at a time away from each control's 1M base, Craftax-1M, 3 seeds
# per config (the published configs keep their 10: they are the reproduction checks).
budget: 1m
eval: final
env: Craftax-Symbolic-v1
seeds: 3
runs:
  ppo: {configs: coarse}
  ppo-rnn: {configs: coarse}
  pqn-rnn: {configs: coarse}
  # Phase 1 methods; dyna-q resolves smdp-skills.tuned (mark it before queueing dyna-q).
  count-bonus-ppo-rnn: {config: count-bonus, configs: coarse}
  count-bonus-pqn-rnn: {config: count-bonus, configs: coarse}
  sil: {configs: coarse}
  smdp-skills: {configs: coarse}
  dyna-q: {configs: coarse}
