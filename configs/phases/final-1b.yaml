# Finals at Craftax-1B: 3 seeds (0-2), every log-spaced checkpoint evaluated; indicative,
# significance claims are made at 1M. Every entry runs its `tuned` config at 1b, as
# final-1m does: the controls' tuned blocks are empty, so they run their published 1B
# column (`base` plus `budgets.1b`: PPO Table 7, PPO-RNN Table 7 with the published ReLU
# network, PQN-RNN the repo 1B config), and a method's donor is always its control's
# tuned config. The methods run their tuned 1M knobs on their control's 1B settings
# (`base_from` resolves the donor at 1b).
budget: 1b
eval: log_spaced
env: Craftax-Symbolic-v1
seeds: 3
runs:
  ppo: {configs: [tuned]}
  ppo-rnn: {configs: [tuned]}
  pqn-rnn: {configs: [tuned]}
  count-bonus-ppo-rnn: {config: count-bonus, configs: [tuned]}
  count-bonus-pqn-rnn: {config: count-bonus, configs: [tuned]}
  sil: {configs: [tuned]}
  smdp-skills: {configs: [tuned]}
  dyna-q: {configs: [tuned]}
