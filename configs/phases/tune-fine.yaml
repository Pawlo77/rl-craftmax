# Stage 2 of the tuning: around each control's best stage-1 config, the numeric knobs with
# the largest stage-1 effect (the `grid.fine` rule of the method file), Craftax-1M, 3 seeds
# per config. The configs are generated by `--expand-fine <slug>` from the tune-coarse
# results: run `make queue PHASE=tune-fine METHOD=<slug> FINE=<slug>`.
budget: 1m
eval: final
env: Craftax-Symbolic-v1
seeds: 3
runs:
  ppo: {configs: fine}
  ppo-rnn: {configs: fine}
  pqn-rnn: {configs: fine}
  # Phase 1 methods; each entry expands with `--expand-fine <slug>` once its tune-coarse
  # is complete (dyna-q also needs smdp-skills marked tuned, its base_from).
  count-bonus-ppo-rnn: {config: count-bonus, configs: fine}
  count-bonus-pqn-rnn: {config: count-bonus, configs: fine}
  sil: {configs: fine}
  smdp-skills: {configs: fine}
  dyna-q: {configs: fine}
