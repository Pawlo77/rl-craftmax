# Combination of the two best compatible methods (Phase 3 Task 1); the schema is
# documented in orchestration/queue.py, the composition in training/interface.py
# (`combine`).
#
# Written by `python -m wut_murl_craftax.evaluation.select_pair --phase final-1m`
# (ruling R71): the methods ranked by the IQM of their tuned config's final scores,
# ties by the probability of improvement (PoI) over their base control; the pair is
# the best compatible one (one control, hook methods only, no knob set two ways).
# `base` is the control's tuned config plus each method's tuned knobs (its `base` keys
# with its `tuned` block applied); `abort` and `budgets` join both methods' rules. No
# retuning: one config, `combined`.
#
# Ranking (rank, registry, control, seeds, IQM, PoI over the control):
#   1 count-bonus-ppo-rnn ppo-rnn 10 2.27844 0.680
#   2 sil ppo-rnn 10 2.13793 0.330
#   3 count-bonus-pqn-rnn pqn-rnn 10 1.55828 0.560
#   4 dyna-q pqn-rnn 10 1.19965 0.350
#   5 smdp-skills pqn-rnn 10 0.90668 0.240
combine:
  base: ppo-rnn
  methods: [count-bonus-ppo-rnn, sil]

base:
  base_from: ppo-rnn.tuned
  # count-bonus-ppo-rnn
  beta: 0.1
  granularity: recipe
  decay: constant
  log2_k: 20
  key: progress
  max_occupancy: 0.25
  # sil
  lambda_sil: 0.3
  slots_windows: 2
  sil_steps: 1
  window: 128
  beta_v: 0.01
  batch: 32
  alpha: 0.6
  insert_cap: 64
  layout: slots

grid:
  coarse:
  - {name: combined}
  fine: null

# Both methods' runner rules on ppo-rnn.
abort:
  finite: [ppo/policy_loss, ppo/value_loss, count/r_int_mean, count/table_full, count/negative_counts, sil/policy_loss, sil/value_loss, sil/dominates]
  permanent: [count/table_full, sil/dominates]
  limits:
  - {metric: ppo/ratio_first_mb, min: 0.999, max: 1.001}
  flags:
  - {name: kl_high, metric: ppo/approx_kl, above: 0.1, updates: 3}
  - {name: entropy_collapse, metric: ppo/entropy, below: 0.2, before: 0.1}
  - {name: value_failure, metric: ppo/explained_variance, below: 0.0, after: 0.2, updates: 5}
  - {name: hidden_saturation, metric: rnn/hidden_saturation, above: 0.9, span: 0.05}

# never tuned: the phases run `combined`
tuned: null
