# SMDP Q-learning over hand-defined skills; the schema is documented in orchestration/queue.py.
# The skill network is the PQN-RNN control's tuned config (base_from), widened by the skill
# one-hot and the step-limit fraction (extra_obs_dim 26 = 25 skills + 1). Every top-level knob
# is set here, so no dataclass default decides a run: the fixed settings of the plan (2^20
# table rows, q_init 10 above early returns, top-level epsilon from 1 to 0.05, low-stat flags
# in the key) and the design defaults of the tuned knobs. The top-level discount is set as
# its horizon top_horizon = 1 / (1 - gamma) (200: gamma 0.995, 1000: 0.999), so the fine
# grid's factors scale the horizon (1000 x 0.5, 1, 2: gamma 0.998, 0.999, 0.9995).
# Ablations at final-1m, as phase-file overrides: random top level `set: {eps_top_end: 1.0}`
# (greedy evaluation keeps it random),
# Monte Carlo top level `set: {monte_carlo: true}`, no low-stat flags `set: {low_flags: false}`
# (no flags in the key and no low-stat skill interruption).
base:
  base_from: pqn-rnn.tuned
  extra_obs_dim: 26
  alpha: 0.2
  top_horizon: 1000
  eps_top_decay: 0.1
  eps_top_end: 0.05
  timeout_mult: 1.0
  granularity: recipe
  log2_rows: 20
  q_init: 10.0
  low_flags: true
  monte_carlo: false
  mc_length: 1024

grid:
  # Stage 1: alpha x horizon x epsilon decay x timeout multiplier x key granularity,
  # 2 x 2 x 2 x 3 x 2 = 48 configs, 3 seeds each.
  coarse:
    - {name: a0.05-h200-e0.1-t0.5-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.05-h200-e0.1-t0.5-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: log2}
    - {name: a0.05-h200-e0.1-t1-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.05-h200-e0.1-t1-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: log2}
    - {name: a0.05-h200-e0.1-t2-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.05-h200-e0.1-t2-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: log2}
    - {name: a0.05-h200-e0.3-t0.5-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.05-h200-e0.3-t0.5-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: log2}
    - {name: a0.05-h200-e0.3-t1-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.05-h200-e0.3-t1-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: log2}
    - {name: a0.05-h200-e0.3-t2-recipe, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.05-h200-e0.3-t2-log2, alpha: 0.05, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: log2}
    - {name: a0.05-h1000-e0.1-t0.5-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.05-h1000-e0.1-t0.5-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: log2}
    - {name: a0.05-h1000-e0.1-t1-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.05-h1000-e0.1-t1-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: log2}
    - {name: a0.05-h1000-e0.1-t2-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.05-h1000-e0.1-t2-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: log2}
    - {name: a0.05-h1000-e0.3-t0.5-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.05-h1000-e0.3-t0.5-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: log2}
    - {name: a0.05-h1000-e0.3-t1-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.05-h1000-e0.3-t1-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: log2}
    - {name: a0.05-h1000-e0.3-t2-recipe, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.05-h1000-e0.3-t2-log2, alpha: 0.05, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: log2}
    - {name: a0.2-h200-e0.1-t0.5-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.2-h200-e0.1-t0.5-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: log2}
    - {name: a0.2-h200-e0.1-t1-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.2-h200-e0.1-t1-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: log2}
    - {name: a0.2-h200-e0.1-t2-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.2-h200-e0.1-t2-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: log2}
    - {name: a0.2-h200-e0.3-t0.5-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.2-h200-e0.3-t0.5-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: log2}
    - {name: a0.2-h200-e0.3-t1-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.2-h200-e0.3-t1-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: log2}
    - {name: a0.2-h200-e0.3-t2-recipe, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.2-h200-e0.3-t2-log2, alpha: 0.2, top_horizon: 200, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: log2}
    - {name: a0.2-h1000-e0.1-t0.5-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.2-h1000-e0.1-t0.5-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 0.5, granularity: log2}
    - {name: a0.2-h1000-e0.1-t1-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.2-h1000-e0.1-t1-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 1.0, granularity: log2}
    - {name: a0.2-h1000-e0.1-t2-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.2-h1000-e0.1-t2-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.1, timeout_mult: 2.0, granularity: log2}
    - {name: a0.2-h1000-e0.3-t0.5-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: recipe}
    - {name: a0.2-h1000-e0.3-t0.5-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 0.5, granularity: log2}
    - {name: a0.2-h1000-e0.3-t1-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: recipe}
    - {name: a0.2-h1000-e0.3-t1-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 1.0, granularity: log2}
    - {name: a0.2-h1000-e0.3-t2-recipe, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: recipe}
    - {name: a0.2-h1000-e0.3-t2-log2, alpha: 0.2, top_horizon: 1000, eps_top_decay: 0.3, timeout_mult: 2.0, granularity: log2}
  # Stage 2 (`--expand-fine smdp-skills`): the 2 numeric knobs with the largest stage-1
  # effect, best x 0.5, 1, 2 crossed (9 configs, the centre reused by run name); the
  # granularity is categorical and stays at its best value. Entries are generated.
  fine:
    rule: {select: 2, combine: cross}
    knobs:
      - {key: alpha, mul: [0.5, 1.0, 2.0], clip: [0.0, 1.0]}
      - {key: top_horizon, mul: [0.5, 1.0, 2.0]}
      - {key: eps_top_decay, mul: [0.5, 1.0, 2.0], clip: [0.0, 1.0]}
      - {key: timeout_mult, mul: [0.5, 1.0, 2.0]}

# Runner rules (orchestration/abort.py): a non-finite loss column (the skill network's TD
# loss as value_loss, grad_norm) or a metric in `finite` aborts the run. The three guards of
# training/smdp.py are 0 and turn NaN on a NaN or inf in a table update, a loss or the
# network's parameters (smdp/nan), more than a quarter of the table rows decided at
# (smdp/table_full), or an updated entry above 300, more than any discounted return of the
# 226 achievement reward plus the bounded health term (smdp/divergence). Every smdp/* metric
# is finite otherwise. A full table or a diverged entry breaks again on any retry, so
# `permanent` ends those runs for good (tag abort/guard); a NaN is retried once. No flags:
# the plan's detectors come with the analysis plan.
abort:
  finite: [smdp/nan, smdp/table_full, smdp/divergence]
  permanent: [smdp/table_full, smdp/divergence]

# written by `--mark-tuned smdp-skills <hash8>`
tuned:
  alpha: 0.05
  top_horizon: 200
  eps_top_decay: 0.3
  timeout_mult: 2.0
