# PPO-RNN method config; the schema is documented in orchestration/queue.py.
# `base` is PPO's Craftax-1M column (Table 11) with the recurrent network (Dense 512 ReLU,
# GRU 512, 2 x Dense 512 heads). PPORNNConfig's code defaults are PPO's Classic debugging
# ones, so every field is set here.
base:
  env: Craftax-Symbolic-v1
  envs: 256
  num_steps: 16
  update_epochs: 4
  minibatches: 8
  lr: 3.0e-4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.8
  clip: 0.2
  vf: 0.5
  ent: 0.01
  max_grad_norm: 1.0
  width: 512
  rnn_width: 512
  activation: relu
  resets: optimistic
  reset_ratio: 16

# Craftax-1B (Table 7) with the published network (ReLU, the base): only these keys differ.
budgets:
  1b: {envs: 1024, num_steps: 64, lr: 2.0e-4}

grid:
  # Stage 1: one knob away from `base` per entry; the published config is the
  # reproduction check, so it gets 10 seeds (the other entries use the phase's 3).
  coarse:
    - {name: published-1m, seeds: 10}
    - {name: shape-1024x64, envs: 1024, num_steps: 64, lr: 2.0e-4}
    - {name: shape-64x64, envs: 64, num_steps: 64}
    - {name: activation-tanh, activation: tanh}
    - {name: lr-2e-4, lr: 2.0e-4}
    - {name: lr-4e-4, lr: 4.0e-4}
    - {name: lambda-0.9, gae_lambda: 0.9}
    - {name: ent-0, ent: 0.0}
  # Stage 2 (`--expand-fine ppo-rnn`): around the best coarse config, the 2 numeric knobs
  # with the largest stage-1 effect, one knob at a time (4 configs); the rollout shape and
  # the activation are categorical and never refined. Entries are generated, not written.
  fine:
    rule: {select: 2, combine: each}
    knobs:
      - {key: lr, mul: [0.75, 1.5]}
      - {key: gae_lambda, add: [-0.05, 0.05]}
      - {key: ent, mul: [0.5, 2.0], zero: [0.001, 0.003]}

# Runner rules, PPO's thresholds plus the recurrent ones (orchestration/abort.py). A
# non-finite loss column (all seven are checked) or a metric in `finite` aborts the run
# (one retry from state/, then a bug). `limits` end a run for good (tag abort/guard) when
# a metric leaves its bounds: ppo/ratio_first_mb, the mean ratio of epoch 1's first
# minibatch, is exactly 1 when the sequence rerun from the stored start hidden
# reproduces the rollout; a gap beyond 1e-3 is a recompute bug (the device check of
# knowledge/methods/PPO-RNN design.md found 7.2e-7 on Metal), and a retry repeats it.
# `flags` only tag a run: hidden_saturation is the share of GRU units above 0.95 in
# absolute value, here above 0.9 for 5% of the budget in a row. No rule reads the score.
abort:
  finite: [ppo/policy_loss, ppo/value_loss]
  limits:
    - {metric: ppo/ratio_first_mb, min: 0.999, max: 1.001}
  flags:
    - {name: kl_high, metric: ppo/approx_kl, above: 0.1, updates: 3}
    - {name: entropy_collapse, metric: ppo/entropy, below: 0.2, before: 0.1}
    - {name: value_failure, metric: ppo/explained_variance, below: 0.0, after: 0.2, updates: 5}
    - {name: hidden_saturation, metric: rnn/hidden_saturation, above: 0.9, span: 0.05}

# written by `--mark-tuned ppo-rnn <hash8>`
tuned: {}
