# PPO method config; the schema is documented in orchestration/queue.py.
# `base` is the Craftax-1M column (Table 11) of the PPO plan's fixed settings.
base:
  env: Craftax-Symbolic-v1
  envs: 256
  num_steps: 16
  update_epochs: 4
  minibatches: 8
  lr: 3.0e-4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.8
  clip: 0.2
  vf: 0.5
  ent: 0.01
  max_grad_norm: 1.0
  width: 512
  resets: optimistic
  reset_ratio: 16

# Craftax-1B column (Table 7): only these three keys differ from Table 11.
budgets:
  1b: {envs: 1024, num_steps: 64, lr: 2.0e-4}

grid:
  # Stage 1: one knob away from `base` per entry; the published config is the
  # reproduction check, so it gets 10 seeds (the other entries use the phase's 3).
  coarse:
    - {name: published-1m, seeds: 10}
    - {name: shape-1024x64, envs: 1024, num_steps: 64, lr: 2.0e-4}
    - {name: lr-2e-4, lr: 2.0e-4}
    - {name: lr-4e-4, lr: 4.0e-4}
    - {name: lambda-0.7, gae_lambda: 0.7}
    - {name: lambda-0.9, gae_lambda: 0.9}
    - {name: ent-0, ent: 0.0}
  # Stage 2 (`--expand-fine ppo`): around the best coarse config, the 2 numeric knobs
  # with the largest stage-1 effect, one knob at a time (4 configs); the rollout
  # shape is categorical and never refined. Entries are generated, not written.
  fine:
    rule: {select: 2, combine: each}
    knobs:
      - {key: lr, mul: [0.75, 1.5]}
      - {key: gae_lambda, add: [-0.05, 0.05]}
      - {key: ent, mul: [0.5, 2.0], zero: [0.001, 0.003]}

# Runner rules, thresholds of the PPO plan (Task 9). A non-finite loss always aborts the
# run (orchestration/abort.py); these only tag it `flag/<name>`, never stop it.
abort:
  flags:
    - {name: kl_high, metric: ppo/approx_kl, above: 0.1, updates: 3}
    - {name: entropy_collapse, metric: ppo/entropy, below: 0.2, before: 0.1}
    - {name: value_failure, metric: ppo/explained_variance, below: 0.0, after: 0.2}

# written by `--mark-tuned ppo <hash8>`
tuned: null
