# PQN-RNN method config; the schema is documented in orchestration/queue.py.
# `base` is the repo config (purejaxql pqn_rnn_craftax.yaml at 47af6d7) with the 1M rollout
# shape (256 envs x 16 steps, PPO's 1M shape): the 1B shape gives only 7 updates at 1M.
# `extra_obs_dim` is set by the methods that append network inputs, not here.
base:
  env: Craftax-Symbolic-v1
  envs: 256
  num_steps: 16
  minibatches: 4
  epochs: 4
  lr: 3.0e-4
  lr_linear_decay: true
  max_grad_norm: 0.5
  gamma: 0.99
  lam: 0.5
  eps_start: 1.0
  eps_finish: 0.005
  eps_decay: 0.1
  hidden: 512
  norm_input: true
  norm_type: layer_norm
  input_norm: batch_renorm
  add_last_action: true
  rew_scale: 1.0
  reset_ratio: 16

# Craftax-1B is the repo config: only the rollout shape differs from the 1M base. A budget's
# `abort` (not part of the config) replaces flag rules by name: see the abort block below.
budgets:
  1b:
    envs: 1024
    num_steps: 128
    abort:
      flags:
        - {name: bn_var_low, metric: pqn/bn_dead_share, above: 0.9}

grid:
  # Stage 1: one knob away from `base` per entry, 3 seeds each (the phase's count). There
  # is no published 1M number, so the base is an ordinary entry (`base` itself is a
  # reserved name); the 1M check is against the original code. 10 configs.
  coarse:
    - {name: base-1m}
    - {name: shape-1024x128, envs: 1024, num_steps: 128}
    - {name: shape-64x64, envs: 64, num_steps: 64}
    - {name: lr-1.5e-4, lr: 1.5e-4}
    - {name: lr-6e-4, lr: 6.0e-4}
    - {name: lambda-0, lam: 0.0}
    - {name: lambda-0.8, lam: 0.8}
    - {name: eps-decay-0.25, eps_decay: 0.25}
    - {name: norm-batch-hidden, norm_type: batch_norm}  # paper Table 4 literally
    - {name: norm-layer-input, input_norm: layer_norm}  # no batch statistics
  # Stage 2 (`--expand-fine pqn-rnn`): around the best coarse config, the 2 numeric knobs
  # with the largest stage-1 effect, one knob at a time (4 configs); the rollout shape and
  # the normalisation are categorical and never refined. Entries are generated.
  fine:
    rule: {select: 2, combine: each}
    knobs:
      - {key: lr, mul: [0.75, 1.5]}
      - {key: lam, add: [-0.1, 0.1], clip: [0.0, 0.95]}
      - {key: eps_decay, mul: [0.5, 2.0]}

# Runner rules (orchestration/abort.py). A non-finite loss column (the trainer reports
# the TD loss as `value_loss` and `grad_norm`; both are checked) or a metric in `finite`
# aborts the run (one retry from state/, then a bug). `limits` end a run for good (tag
# abort/guard): no Craftax episode returns more than the 226 achievement points plus a
# small net health term, so a mean max-Q above 300 is a divergence, and a retry repeats
# it. `flags` only tag a run: td_spike is a TD loss above 10 x the median of its earlier
# updates for 3 updates in a row; action_gap_flat is a mean gap between the best and the
# second-best Q below 1e-3 for 3 updates once epsilon is at its floor (eps_finish 0.005,
# with a margin); bn_var_low is the input BatchRenorm's smallest running variance below
# 1e-6. That cannot happen at 1M (3.9k Q steps leave at least 0.999^3.9k = 0.02), but at 1B
# (122k Q steps) every run would flag it: at 1M, 76.5-79.5% of the 8268 inputs never vary
# in a whole run (39 finished tune-coarse runs; block types of floors not reached), and such
# an input decays below 1e-6 after 13.8k Q steps. The variance epsilon (1e-3) bounds the
# normalised value of any of them alike, so one dead input is no hazard; many are. At 1B
# the flag is a share of inputs below 1e-6 (`pqn/bn_dead_share`) above 0.9: an agent whose
# observations stopped varying. No rule reads the score.
abort:
  finite: [pqn/td_loss]
  limits:
    - {metric: pqn/q_max_mean, max: 300}
  flags:
    - {name: td_spike, metric: pqn/td_loss, above_median: 10, updates: 3}
    - {name: action_gap_flat, metric: pqn/action_gap, below: 1.0e-3, updates: 3, when: {metric: pqn/epsilon, below: 0.0051}}
    - {name: bn_var_low, metric: pqn/bn_var_min, below: 1.0e-6}

# written by `--mark-tuned pqn-rnn <hash8>`
tuned: {}
