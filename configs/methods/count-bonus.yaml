# Count-based progress bonus config; the schema is documented in orchestration/queue.py.
# Two registry entries share it: count-bonus-ppo-rnn and count-bonus-pqn-rnn. Each `base`
# block starts from its tuned control and sets every method knob, so no code default
# decides a run: beta, key granularity and decay (the design defaults, smoke config A),
# plus the fixed table of 2^20 int32 slots over the progress key, which aborts above a
# quarter full (about 12% of the keys would share a slot; a run reaches thousands of
# progress keys, far below 262,144).
#
# The SimHash ablation (final-1m, PPO-RNN variant's tuned config) counts a 64-bit sign
# hash of the whole observation, a new code almost every step: up to 1M codes in a 1M
# run. It sets a larger table and a lower threshold, in the phase file as
#   set: {key: simhash, log2_k: 24, max_occupancy: 0.1}
# 2^24 slots (64 MB of counts) keep 1M codes below 6% occupancy (about 3% collisions),
# so the guard cannot fire within 1M steps; 0.1 still stops a longer run before about
# 5% of its codes collide. The SimHash state has no `seen` side table.
base:
  ppo-rnn:
    base_from: ppo-rnn.tuned
    beta: 0.1
    granularity: recipe
    decay: constant
    log2_k: 20
    key: progress
    max_occupancy: 0.25
  pqn-rnn:
    base_from: pqn-rnn.tuned
    beta: 0.1
    granularity: recipe
    decay: constant
    log2_k: 20
    key: progress
    max_occupancy: 0.25

grid:
  # Stage 1: beta x granularity x decay, 4 x 3 x 2 = 24 configs for each variant, 3 seeds.
  # Stage 2 (fine): beta x {0.5, 1, 2} crossed with 2 values of the categorical knob,
  # granularity or decay, whose stage-1 means spread more: the best config's value and
  # the next by mean stage-1 score; 3 x 2 = 6 configs per variant (`always` keeps beta
  # in, `select: 1` ranks the two categorical knobs). Generated by `--expand-fine
  # count-bonus`.
  coarse:
    - {name: b0.01-tiers-constant, beta: 0.01, granularity: tiers, decay: constant}
    - {name: b0.01-tiers-linear, beta: 0.01, granularity: tiers, decay: linear}
    - {name: b0.01-recipe-constant, beta: 0.01, granularity: recipe, decay: constant}
    - {name: b0.01-recipe-linear, beta: 0.01, granularity: recipe, decay: linear}
    - {name: b0.01-log2-constant, beta: 0.01, granularity: log2, decay: constant}
    - {name: b0.01-log2-linear, beta: 0.01, granularity: log2, decay: linear}
    - {name: b0.03-tiers-constant, beta: 0.03, granularity: tiers, decay: constant}
    - {name: b0.03-tiers-linear, beta: 0.03, granularity: tiers, decay: linear}
    - {name: b0.03-recipe-constant, beta: 0.03, granularity: recipe, decay: constant}
    - {name: b0.03-recipe-linear, beta: 0.03, granularity: recipe, decay: linear}
    - {name: b0.03-log2-constant, beta: 0.03, granularity: log2, decay: constant}
    - {name: b0.03-log2-linear, beta: 0.03, granularity: log2, decay: linear}
    - {name: b0.1-tiers-constant, beta: 0.1, granularity: tiers, decay: constant}
    - {name: b0.1-tiers-linear, beta: 0.1, granularity: tiers, decay: linear}
    - {name: b0.1-recipe-constant, beta: 0.1, granularity: recipe, decay: constant}
    - {name: b0.1-recipe-linear, beta: 0.1, granularity: recipe, decay: linear}
    - {name: b0.1-log2-constant, beta: 0.1, granularity: log2, decay: constant}
    - {name: b0.1-log2-linear, beta: 0.1, granularity: log2, decay: linear}
    - {name: b0.3-tiers-constant, beta: 0.3, granularity: tiers, decay: constant}
    - {name: b0.3-tiers-linear, beta: 0.3, granularity: tiers, decay: linear}
    - {name: b0.3-recipe-constant, beta: 0.3, granularity: recipe, decay: constant}
    - {name: b0.3-recipe-linear, beta: 0.3, granularity: recipe, decay: linear}
    - {name: b0.3-log2-constant, beta: 0.3, granularity: log2, decay: constant}
    - {name: b0.3-log2-linear, beta: 0.3, granularity: log2, decay: linear}
  fine:
    rule: {select: 1, combine: cross}
    knobs:
      - {key: beta, mul: [0.5, 1, 2], always: true}
      - {key: granularity, top: 2}
      - {key: decay, top: 2}

# Runner rules (orchestration/abort.py): a non-finite loss column of the base aborts the
# run, and so does a metric in `finite`. A NaN or inf bonus makes count/r_int_mean
# non-finite; the two guards of training/count_bonus.py turn NaN when the table is fuller
# than `max_occupancy` or a count is below 0. Every count/* metric is finite otherwise.
# A full table fills again on any retry, so `permanent` ends that run for good (tag
# abort/guard). The controls' rules come first, copied from ppo-rnn.yaml and pqn-rnn.yaml
# (one block serves both variants: each reports only its base's names, the runner skips
# the others): the method only adds a reward, so the base's checks still hold.
abort:
  finite: [ppo/policy_loss, ppo/value_loss, pqn/td_loss, count/r_int_mean, count/table_full, count/negative_counts]
  permanent: [count/table_full]
  limits:
    - {metric: ppo/ratio_first_mb, min: 0.999, max: 1.001}
    - {metric: pqn/q_max_mean, max: 300}
  flags:
    - {name: kl_high, metric: ppo/approx_kl, above: 0.1, updates: 3}
    - {name: entropy_collapse, metric: ppo/entropy, below: 0.2, before: 0.1}
    - {name: value_failure, metric: ppo/explained_variance, below: 0.0, after: 0.2, updates: 5}
    - {name: hidden_saturation, metric: rnn/hidden_saturation, above: 0.9, span: 0.05}
    - {name: td_spike, metric: pqn/td_loss, above_median: 10, updates: 3}
    - {name: action_gap_flat, metric: pqn/action_gap, below: 1.0e-3, updates: 3, when: {metric: pqn/epsilon, below: 0.0051}}
    - {name: bn_var_low, metric: pqn/bn_var_min, below: 1.0e-6}

# written by `--mark-tuned count-bonus <hash8>`, one block per variant
tuned: null
