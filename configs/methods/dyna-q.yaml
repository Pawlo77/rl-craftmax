# Dyna-Q over the SMDP skills method; the schema is documented in orchestration/queue.py.
# Everything of smdp-skills (skills, skill network, top-level knobs) comes from its tuned
# config (base_from); only the planning knobs below are new. Every planning setting is set
# here, so no dataclass default decides a run: the plan's fixed settings (P = 2^16 visited
# pairs, M = 8 ring slots, batches of 1024, prioritized-sweeping threshold 1e-4, value
# iteration to a per-sweep change below 1e-3 or 50 sweeps) and the smoke config A defaults of
# the tuned knobs (uniform, n = 5, kappa 0). plan_n is the number of planning backups per real
# skill end of the rollout (n = 0 is smdp-skills exactly; value iteration ignores it);
# plan_kappa is the Dyna-Q+ bonus per sqrt time unit, a unit being 1/1000 of the budget.
# Ablation at final-1m, as a phase-file override of tuned: `set: {plan_kappa: 0.0}` when the
# best kappa is above 0, else the best nonzero stage-1 kappa.
base:
  base_from: smdp-skills.tuned
  plan_variant: uniform
  plan_n: 5
  plan_kappa: 0.0
  model_slots: 8
  model_pairs: 65536
  plan_batch: 1024
  ps_theta: 1.0e-4
  vi_tol: 1.0e-3
  vi_max_sweeps: 50

# Craftax-1B tables, sized from a log-log fit of each tuned 1M run's rows and pairs against
# env steps (fit over 10-100 % of the run, projected to 1e9, largest of the 10 seeds):
# 1.2 million rows and 23 million pairs (median 8,600 rows and 0.11 million pairs). The
# smallest rows with the projection at most half the guard (`smdp/table_full` at a quarter
# of the rows) are 2^24; the pairs would need 2^26, but 2^25 is the largest the device
# memory allows (6.7 GB of tables at 1B, 2.0 GB at 2^22 rows/pairs; the 1M model is 0.3 GB):
# its margin to `dyna/model_full` is 1.45 x the largest projection (11.8 x the 90th
# percentile, 2.9 million pairs). Capacity and collisions only; smdp-skills keeps 2^20
# rows (its projection, 50,000, is a fifth of its guard).
budgets:
  1b: {log2_rows: 24, model_pairs: 33554432}

grid:
  # Stage 1: (uniform, prioritized) x n (1, 5, 20) x kappa (0, 0.003, 0.03), plus value
  # iteration x kappa: 21 configs, 3 seeds each.
  coarse:
    - {name: uniform-n1-k0, plan_variant: uniform, plan_n: 1, plan_kappa: 0.0}
    - {name: uniform-n1-k0.003, plan_variant: uniform, plan_n: 1, plan_kappa: 0.003}
    - {name: uniform-n1-k0.03, plan_variant: uniform, plan_n: 1, plan_kappa: 0.03}
    - {name: uniform-n5-k0, plan_variant: uniform, plan_n: 5, plan_kappa: 0.0}
    - {name: uniform-n5-k0.003, plan_variant: uniform, plan_n: 5, plan_kappa: 0.003}
    - {name: uniform-n5-k0.03, plan_variant: uniform, plan_n: 5, plan_kappa: 0.03}
    - {name: uniform-n20-k0, plan_variant: uniform, plan_n: 20, plan_kappa: 0.0}
    - {name: uniform-n20-k0.003, plan_variant: uniform, plan_n: 20, plan_kappa: 0.003}
    - {name: uniform-n20-k0.03, plan_variant: uniform, plan_n: 20, plan_kappa: 0.03}
    - {name: prioritized-n1-k0, plan_variant: prioritized, plan_n: 1, plan_kappa: 0.0}
    - {name: prioritized-n1-k0.003, plan_variant: prioritized, plan_n: 1, plan_kappa: 0.003}
    - {name: prioritized-n1-k0.03, plan_variant: prioritized, plan_n: 1, plan_kappa: 0.03}
    - {name: prioritized-n5-k0, plan_variant: prioritized, plan_n: 5, plan_kappa: 0.0}
    - {name: prioritized-n5-k0.003, plan_variant: prioritized, plan_n: 5, plan_kappa: 0.003}
    - {name: prioritized-n5-k0.03, plan_variant: prioritized, plan_n: 5, plan_kappa: 0.03}
    - {name: prioritized-n20-k0, plan_variant: prioritized, plan_n: 20, plan_kappa: 0.0}
    - {name: prioritized-n20-k0.003, plan_variant: prioritized, plan_n: 20, plan_kappa: 0.003}
    - {name: prioritized-n20-k0.03, plan_variant: prioritized, plan_n: 20, plan_kappa: 0.03}
    - {name: vi-k0, plan_variant: value_iteration, plan_kappa: 0.0}
    - {name: vi-k0.003, plan_variant: value_iteration, plan_kappa: 0.003}
    - {name: vi-k0.03, plan_variant: value_iteration, plan_kappa: 0.03}
  # Stage 2 (`--expand-fine dyna-q`): kappa x M, best x 0.5, 1, 2 crossed (9 configs, the
  # centre reused by run name); a best kappa of 0 gives 0, 0.0015, 0.003 instead; M 8 gives
  # 4, 8, 16. Entries are generated.
  fine:
    rule: {select: 2, combine: cross}
    knobs:
      - {key: plan_kappa, mul: [0.5, 1.0, 2.0], zero: [0.0, 0.0015, 0.003]}
      - {key: model_slots, mul: [0.5, 1.0, 2.0], integer: true}

# Runner rules (orchestration/abort.py): a non-finite loss column (the skill network's TD
# loss as value_loss, grad_norm) or a metric in `finite` aborts the run. The smdp-skills
# guards (smdp/nan, smdp/table_full, smdp/divergence) watch the real updates; the Dyna-Q
# guards of training/dyna_q.py are 0 and turn NaN on a NaN or inf in a planned table value
# (dyna/nan), all P model pair slots taken (dyna/model_full; 2^16 at 1M, 2^25 at 1B), or a planned value
# above the run's bound (dyna/divergence). In Dyna runs both divergence guards use
# 300 + plan_kappa sqrt(1000) / (1 - gamma_top) (dyna_q.max_q): a stale tau = 1 self-loop
# with the full Dyna-Q+ bonus settles near it, healthy optimism; kappa 0 keeps the
# smdp-skills 300. Every other dyna/* metric is finite. The capacity and divergence guards
# break again on any retry, so `permanent` ends those runs for good (tag abort/guard). The
# flag plan_slow tags a run whose planning takes more than 30% of an update's wall time
# for 3 updates in a row (a process's first planning call compiles); it never stops the
# run. The plan's detectors come with the analysis plan.
abort:
  finite: [smdp/nan, smdp/table_full, smdp/divergence, dyna/nan, dyna/model_full, dyna/divergence]
  permanent: [smdp/table_full, smdp/divergence, dyna/model_full, dyna/divergence]
  flags:
    - {name: plan_slow, metric: dyna/plan_wall_share, above: 0.3, updates: 3}

# written by `--mark-tuned dyna-q <hash8>`
tuned:
  plan_n: 1
  plan_kappa: 0.006
  model_slots: 4
