# Cluster node with one NVIDIA GPU: rollouts and updates on the GPU.
# Runtime settings only; a run trains identically under every profile.
host_devices: 1  # no CPU split: the env batch lives on the GPU
device_roles: gpu
# Host RAM a method's buffers may take. The node's RAM is not known yet (80 GB GPU nodes
# usually have 128 GB or more); 64 GiB is a safe half, raise it once the cluster is measured.
memory_limit_bytes: 68719476736
checkpoint_every: 50  # a GPU run advances fast and is preempted rarely; state saves cost more per update
# A stop waits for the chunk (<= 50 updates, about 40 s at 1B): run_array.sh asks for SIGTERM 600 s early.
# Measured on an A100 (TF32) on 2026-10-31: worst recompute gap 5.5e-5, below the 1e-4 bound
# (PPO-RNN design, Device verification), so every limit is final. A GPU class not measured yet
# lists ppo/ratio_first_mb here again: a hit is then retried, not final.
unmeasured_limits: []
# 1B storage: a finished, fully evaluated run's state/ (0.45-1.8 GB at 1,024 envs) is deleted at
# once, so the copy back to the laptop is ckpt/, eval/ and the logs only (0.4-0.65 GB a run).
# Killed, failed and unevaluated runs keep it to resume.
drop_state_on_finish: true
