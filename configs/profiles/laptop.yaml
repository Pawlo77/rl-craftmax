# Apple Silicon laptop (48 GB): Craftax steps fastest on the CPU, network updates on the Metal GPU.
# Runtime settings only; a run trains identically under every profile.
host_devices: 8  # CPU shards of the env batch (one per performance core)
device_roles: cpu-actor  # rollouts on the CPU shards, updates on Metal (runner sets JAX_PLATFORMS)
memory_limit_bytes: 34359738368  # 32 GiB of the 48 GB: leaves the OS, MLflow and a browser their share
checkpoint_every: 10  # a 1M run is ~240 updates, so a kill loses < 5% of it (about 25 state saves)
unmeasured_limits: []  # every abort.limits bound was measured on CPU and Metal
