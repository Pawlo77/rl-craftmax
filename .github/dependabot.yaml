version: 2
updates:
  # Action pins and hook revisions of the shipped files move in python-kit-template
  # (its Upgrade pins job); scripts/upgrade.py covers the workflows this repository owns.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # jax moves with metaljax (Apple GPU), which caps it below 0.12, and with the exact
      # jaxlib and jax[cuda12] pins: one bump alone never resolves. Bump the stack by hand.
      - dependency-name: "jax*"
      - dependency-name: "metaljax"
    commit-message:
      prefix: "build"
    labels: [dependencies]
